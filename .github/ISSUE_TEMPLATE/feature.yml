# Dropdown values (area, platform, size) are copied from the team hub label taxonomy.
# Source of truth: local-flows runner/teamhub_io.py. Change it there first, then here.
name: Feature
description: Something new, or a change to how something works.
title: "Feature: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve, and for whom?
      placeholder: People forget to log meals because it takes too many taps.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should happen?
      description: Describe the result, not the code.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: How will we know it is done?
      description: A short checklist someone can test.
      placeholder: |
        - [ ] A meal can be logged in two taps
        - [ ] It shows up on the Fuel page right away
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      description: Pick the closest one. "unclear" is fine.
      options:
        - assistant      # chatting with the assistant and what it does on its own
        - journal        # journal entries, daily notes, documents
        - horizons       # goals, to-dos, home overview
        - fuel           # workouts, meals, sleep, weight, Apple Health
        - mindfulness    # Core: guided meditations
        - finance        # budgets, debt payoff
        - calendar       # calendar sync and event approvals
        - neighborhood   # friends, circles, sharing, mutual aid
        - constellation  # lessons and the star map
        - accounts       # sign-up, login, onboarding, settings, connected services
        - billing        # plans, payments, usage limits, promo codes
        - infra          # servers, deploys, CI, build setup
        - unclear        # not sure
      default: 12
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where?
      description: Pick every one that applies. Leave empty if you are not sure.
      multiple: true
      options:
        - backend  # the server / API
        - web      # the website
        - ios      # the iPhone app
  - type: dropdown
    id: size
    attributes:
      label: How big does it feel?
      description: "A guess is fine. S = an hour or two, M = about a day, L = several days."
      options:
        - S
        - M
        - L
        - unclear
      default: 3
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches, links, screenshots.
